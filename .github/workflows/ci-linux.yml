name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # Job names are required status checks on master; keep them stable.
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    # The image tag pins the exact toolchain; Renovate proposes patch updates.
    container: swift:${{ matrix.swift-full }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            # renovate: datasource=docker depName=swift
            swift-full: "6.1.3"
          - swift: "6.2"
            # renovate: datasource=docker depName=swift
            swift-full: "6.2.4"
            # swift-syntax with a published prebuilt for this exact toolchain, so SwiftPM downloads it
            # instead of compiling it (prebuilts exist for Linux and Swift 6.2 only). The 6.1 job keeps
            # testing the version from Package.resolved.
            swift-syntax: "602.0.0"
            swift-syntax-revision: "4799286537280063c85a32f09884cfbca301b1a1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-dev
          sdl2-config --version
          swift --version

      # Caches only depend on the toolchain and the dependency graph, so they hold the expensive
      # swift-syntax build. After a dependency update the prefix still restores the last build of
      # this toolchain, so only changed packages rebuild. PRs can read master's caches.
      - name: Restore Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-linux-${{ matrix.swift-full }}-swift-syntax-${{ matrix.swift-syntax || 'resolved' }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-linux-${{ matrix.swift-full }}-swift-syntax-${{ matrix.swift-syntax || 'resolved' }}-release-

      # Rewrites the pin instead of re-resolving: resolving from Package.resolved first would check out
      # its version over the cached one and invalidate the cached build.
      - name: Pin swift-syntax ${{ matrix.swift-syntax }}
        if: matrix.swift-syntax != ''
        run: |
          sed -i -e '/"identity" : "swift-syntax"/,/}/{s/"revision" : "[^"]*"/"revision" : "${{ matrix.swift-syntax-revision }}"/;s/"version" : "[^"]*"/"version" : "${{ matrix.swift-syntax }}"/;}' Package.resolved
          grep -A6 '"identity" : "swift-syntax"' Package.resolved | grep -qF '"version" : "${{ matrix.swift-syntax }}"'

      # One build for the apps and the tests: `swift test` alone would rebuild the whole graph with
      # testability enabled. `-enable-testing` makes the release build usable for `@testable import`.
      - name: Build Release
        run: swift build -c release --build-tests -Xswiftc -enable-testing -Xswiftc -warnings-as-errors

      # Saved right after a successful build, before the tests, so that a test failure still leaves a warm cache.
      - name: Save Build Cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run Tests (Release)
        run: swift test -c release --skip-build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-linux-${{ matrix.swift }}-${{ github.run_id }}
          path: |
            .build/**/release/Asteroids
            .build/**/release/Particles
          if-no-files-found: warn
