name: macOS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            runner: "macos-14"
          - swift: "6.2"
            runner: "macos-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Swift
        if: matrix.swift != '6.2'
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift }}

      - name: Install dependencies
        run: |
          brew install sdl2
          sdl2-config --version

      - name: Build Release
        run: swift build -c release

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-macos-${{ matrix.swift }}-${{ github.run_id }}
          path: |
            .build/**/Asteroids
            .build/**/Particles
          if-no-files-found: warn
